# Builds aiFlow the two ways releases are made and runs the offline tests.
# (The SwiftPM template — `swift build` — can't work: this is an Xcode app
# without Package.swift.)

name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select latest stable Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    # Catches source files missing from aiFlow.xcodeproj (release.sh builds
    # through Xcode; build-local.sh compiles every file and would not notice).
    - name: Xcode project build (unsigned)
      run: |
        xcodebuild -project aiFlow.xcodeproj -target FinderFlow -configuration Release \
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build | tail -n 40
        test "${PIPESTATUS[0]}" -eq 0

    - name: Command Line Tools build (what release.sh --prebuilt packages)
      run: ./build-local.sh Release --no-run

    - name: PDF inspector CLI
      run: ./tools/pdf-inspect/run.sh --build-only

    - name: Google Drive engine (offline, mocked API)
      run: ./tools/gdrive-test/run.sh
